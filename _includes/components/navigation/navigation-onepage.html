<ul class="navbar-nav">
  {% for link in site.data.navigation.onepage.links %}
  <li class="nav-item">
    {% if page.url == '/' %}
    <a class="nav-link scroll" href="{{ link.url }}">{{ link.text }}</a>
    {% else %}
    <a class="nav-link" href="{{ '/' | relative_url }}{{ link.url }}">{{ link.text }}</a>
    {% endif %}
  </li>
  {% endfor %}
</ul>
