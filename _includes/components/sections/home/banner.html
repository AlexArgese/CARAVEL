{% if page.banner.enable %}
<div class="news-banner text-white fw-bold fs-15 mb-2 position-relative" style="z-index: 1;">
  <div class="container py-2 d-flex align-items-center justify-content-center flex-wrap gap-2 text-center">
    {% if page.banner.badge %}
    <span class="badge rounded-pill news-banner-badge">{{ page.banner.badge }}</span>
    {% endif %}
    <p class="mb-0">
      {{ page.banner.text }}
      {% if page.banner.link %}
      <a href="{{ page.banner.link.url }}" class="news-banner-link hover d-inline-flex align-items-center"{% if page.banner.link.target %} target="{{ page.banner.link.target }}"{% endif %}>{{ page.banner.link.label }} <i class="uil uil-arrow-right fs-16"></i></a>
      {% endif %}
    </p>
  </div>
  <!-- /.container -->
</div>
{% endif %}
