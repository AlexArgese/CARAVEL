{% if page.research_section.enable %}
<section id="research" class="wrapper research-caravel">
  <div class="container py-14 py-md-16">
    <h2 class="d-flex align-items-center justify-content-center gap-2 mb-10 text-center research-caravel-heading">
      <img src="{{ '/assets/img/brain-icon.png' | relative_url }}" alt="" class="research-caravel-icon">
      <span class="fw-bold">CARAVEL</span> Research
    </h2>
    <div class="row justify-content-center text-center mb-8">
      <div class="col-lg-8">
        <h3 class="research-caravel-title mb-4">{{ page.research_section.title }}</h3>
        <p class="research-caravel-intro mx-auto mb-0">{{ page.research_section.description }}</p>
      </div>
    </div>
    <div class="text-center mb-8">
      <span class="research-caravel-focus text-line">{{ page.research_section.focus_label }}</span>
    </div>
    <div class="row align-items-center gy-6 gx-lg-8">
      <div class="col-lg-5">
        <div class="research-accordion-media">
          <span class="research-accordion-media-badge" id="research-active-badge">01</span>
          <img src="{{ page.research_section.items.first.image | relative_url }}" alt="" class="research-accordion-media-img" id="research-active-image">
          <p class="research-accordion-media-empty d-none" id="research-active-empty">Illustration coming soon</p>
        </div>
      </div>
      <div class="col-lg-7">
        <div id="accordion-research" class="accordion-wrapper research-accordion">
          {% for item in page.research_section.items %}
          <div class="card accordion-item">
            <div class="card-header" id="research-heading-{{ forloop.index }}">
              <button class="{% unless forloop.first %}collapsed{% endunless %}" data-bs-toggle="collapse" data-bs-target="#research-collapse-{{ forloop.index }}" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="research-collapse-{{ forloop.index }}"{% if item.image %} data-research-image="{{ item.image | relative_url }}"{% endif %}>
                <span class="research-accordion-number">0{{ forloop.index }}</span>{{ item.title }}
              </button>
            </div>
            <div id="research-collapse-{{ forloop.index }}" class="collapse{% if forloop.first %} show{% endif %}" aria-labelledby="research-heading-{{ forloop.index }}" data-bs-parent="#accordion-research">
              <div class="card-body">
                <p class="mb-0">{{ item.text }}</p>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <!-- /.container -->
</section>
<script>
(function () {
  var accordion = document.getElementById('accordion-research');
  var img = document.getElementById('research-active-image');
  var empty = document.getElementById('research-active-empty');
  var badge = document.getElementById('research-active-badge');
  if (!accordion || !img) return;
  var buttons = accordion.querySelectorAll('.card-header button');

  // Bootstrap's collapse data-api handler runs on a document-level click
  // listener, so a normal listener on the button (bubble/target phase)
  // fires too late to stop it from closing an already-open item. A
  // capture-phase document listener runs first and can block it.
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('#accordion-research .card-header button');
    if (btn && btn.getAttribute('aria-expanded') === 'true') {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
    }
  }, true);

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      if (btn.getAttribute('aria-expanded') === 'true') return;
      var src = btn.getAttribute('data-research-image');
      var number = btn.querySelector('.research-accordion-number').textContent;
      img.classList.add('is-swapping');
      setTimeout(function () {
        if (src) {
          img.src = src;
          img.classList.remove('d-none');
          empty.classList.add('d-none');
        } else {
          img.classList.add('d-none');
          empty.classList.remove('d-none');
        }
        badge.textContent = number;
        img.classList.remove('is-swapping');
      }, 200);
    });
  });
})();
</script>
{% endif %}
