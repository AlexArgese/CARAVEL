{% if page.publications_section.enable %}
<section id="publications" class="wrapper bg-light">
  <div class="container py-14 py-md-16">
    <h2 class="d-flex align-items-center justify-content-center gap-2 mb-8 text-center publications-heading">
      <img src="{{ '/assets/img/brain-icon.png' | relative_url }}" alt="" class="publications-icon">
      <span class="text-caravel-navy">CARAVEL</span> <span class="text-caravel-navy fw-bold">Publications</span>
    </h2>
    <div class="d-flex flex-wrap justify-content-center gap-3 mb-8">
      {% for filter in page.publications_section.filters %}
      <button type="button" class="btn btn-sm rounded-pill pub-filter{% if forloop.first %} pub-filter-active{% endif %}" data-filter="{{ filter.filter }}">{{ filter.label }}</button>
      {% endfor %}
    </div>
    <div class="pub-list">
      {% for pub in page.publications_section.items %}
      <div class="pub-row{% unless forloop.last %} pub-row-border{% endunless %}" data-type="{{ pub.type }}">
        <div class="pub-meta">
          <span class="pub-date">{{ pub.date }}</span>
          <span class="pub-tag">{{ pub.tag }}</span>
        </div>
        <div class="pub-divider"></div>
        <div class="pub-content">
          <h3 class="pub-title mb-2">{{ pub.title }}</h3>
          <p class="pub-venue mb-0">{{ pub.venue }}</p>
        </div>
        <div class="pub-action">
          <a href="{{ pub.url }}" class="pub-link" target="_blank">
            <i class="uil uil-file-alt"></i> View paper <i class="uil uil-arrow-up-right"></i>
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <!-- /.container -->
</section>
<script>
(function () {
  var section = document.getElementById('publications');
  if (!section) return;
  var buttons = section.querySelectorAll('.pub-filter');
  var rows = section.querySelectorAll('.pub-row');
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      buttons.forEach(function (b) { b.classList.remove('pub-filter-active'); });
      btn.classList.add('pub-filter-active');
      var filter = btn.getAttribute('data-filter');
      rows.forEach(function (row) {
        row.style.display = (filter === 'all' || row.getAttribute('data-type') === filter) ? '' : 'none';
      });
    });
  });
})();
</script>
{% endif %}
